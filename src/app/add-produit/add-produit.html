<div class="container">

  <h2 class="mb-4">Ajouter un produit</h2>

  <form (ngSubmit)="ajouterProduit()">

    <div class="mb-3">
      <label class="form-label">Nom du produit</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="nom"
        name="nom"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Prix</label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="prix"
        name="prix"
        required>
    </div>

    <div class="mb-3">
      <label class="form-label">Date de création</label>
      <input
        type="date"
        class="form-control"
        [(ngModel)]="dateCreation"
        name="dateCreation"
        required>
    </div>

    <button type="submit" class="btn btn-primary">
      Ajouter
    </button>

  </form>

</div>
